font_family      JetBrains Mono
font_size        16.0
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.7
background_blur 1

cursor_trail 5

dynamic_background_opacity no

confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no
hide_window_decorations yes

window_padding_width 4

include ~/.config/kitty/colors.conf

map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Прерывание процесса (скрипта) на Ctrl + Shift + C
map ctrl+shift+c send_text all \x03

foreground #ffffff

# Цвета обычного текста (0-7)
color0 #ffffff
color1 #ffffff
color2 #ffffff
color3 #ffffff
color4 #ffffff
color5 #ffffff
color6 #ffffff
color7 #ffffff

# Цвета яркого текста (8-15)
color8  #ffffff
color9  #ffffff
color10 #ffffff
color11 #ffffff
color12 #ffffff
color13 #ffffff
color14 #ffffff
color15 #ffffff

