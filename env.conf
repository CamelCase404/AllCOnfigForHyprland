env = NIXOS_OZONE_WL,1
env = XDG_PICTURES_DIR,/home/camelcase/Pictures
env = XDG_VIDEOS_DIR,/home/camelcase/Videos
env = WALLPAPER_DIR,/home/camelcase/Pictures/Wallpapers
env = SCRIPT_DIR,/home/camelcase/.config/hypr/scripts
env = QT_QPA_PLATFORMTHEME,qt6ct

# Hardware Injections
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER,NVIDIA-G0
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __GL_SHADER_DISK_CACHE,1
env = __GL_SHADER_DISK_CACHE_PATH,/home/camelcase/.cache/nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia

# Базовые переменные для XWayland и GTK
env = XCURSOR_THEME, Moga-Black
env = XCURSOR_SIZE, 24

# Отключаем принудительный hyprcursor, чтобы система корректно откатилась на XCursor
env = HYPRCURSOR_THEME, 
env = HYPRCURSOR_SIZE, 
