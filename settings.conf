#  ◈ SETTINGS (AUTOGENERATED FROM SETTINGS.JSON)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 6
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border=$active_border
    col.inactive_border=$inactive_border 
}

decoration {
    rounding = 13
    active_opacity = 1.0
    inactive_opacity = 0.9
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_warps = true
}

misc {
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = yes

    # 1. Окна (Вход): Элегантное появление с мягким «дотягиванием» в конце
    bezier = fluentIn, 0.05, 0.9, 0.1, 1.0
    # 2. Окна (Выход): Плавное, но быстрое исчезновение без рывков
    bezier = fluentOut, 0.3, 0, 0.8, 0.15
    # 3. Слои и Панели: Мягкое появление элементов интерфейса
    bezier = layerCurveIn, 0.1, 0.9, 0.2, 1.0
    # 4. Воркспейсы: Эффект «живого» перелистывания (плавный старт, мягкий стоп)
    bezier = wsSmooth, 0.25, 1, 0.2, 1
    bezier = moveSmooth, 0.15, 0.85, 0.1, 1.0
    bezier = wsBounce, 0.18, 1.15, 0.32, 1.0
    # Применение кривых и настройка скорости
    animation = windows, 1, 7, fluentIn, popin 1%
    animation = windowsOut, 1, 6, fluentOut, popin 60%
    animation = windowsMove, 1, 12, moveSmooth    
    animation = layers, 1, 6, layerCurveIn, fade
    animation = layersIn, 1, 6, layerCurveIn, fade
    animation = layersOut, 1, 5, fluentOut, fade
    
    animation = fade, 1, 6, layerCurveIn
    
    # Воркспейсы теперь переключаются как на современных смартфонах
    animation = workspaces, 1, 8, wsBounce, slide
    animation = specialWorkspaceIn, 1, 8, wsBounce, slidevert
    animation = specialWorkspaceOut, 1,8, wsBounce, slidevert
}
